<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>F3 Science WS Chapter 8 Explained</title><style>body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif;line-height:1.58}.wrap{max-width:1120px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#192747,#56398a);color:#fff;padding:34px 18px}h1{margin:.2rem 0}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #d9e1ec;z-index:5}.nav{display:flex;gap:8px;overflow:auto;padding:10px 18px}.nav a,.btn{white-space:nowrap;text-decoration:none;background:#172d50;color:#fff;padding:8px 12px;border-radius:9px;font-weight:700}.sec{background:#172d50;color:#fff;padding:15px;border-radius:14px;margin-top:24px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 7px 20px #10254810}.answer{background:#f2fbf7;border:1px solid #cce7dc;padding:11px;border-radius:10px;font-weight:800;white-space:pre-wrap}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.lang{background:#f8fafc;border:1px solid #d9e1ec;padding:10px;border-radius:10px}.lang b{display:block;color:#60708a;margin-bottom:4px}.kw{display:inline-block;background:#fff3cf;border:1px solid #ead488;padding:3px 7px;border-radius:7px;margin:3px;font-weight:700}.steps{background:#fff9e9;border:2px dashed #dfb957;padding:10px;border-radius:10px;margin-top:10px}.source{background:#fff4f4;border:1px solid #efcccc}@media(max-width:760px){.tri{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div>FORM 3 SCIENCE • WS CHAPTER 8</div><h1>Radioactivity — 每一题三语答案解释</h1><p>Every question: answer + English + 华语 + Bahasa Melayu + keywords + steps.</p></div></header><nav><div class="nav"><a href="#s81">8.1</a><a href="#s82">8.2</a><a href="#s83">8.3</a><a href="#s84">8.4</a><a href="index.html">回首页</a></div></nav><main class="wrap"><div class="card source"><b>题目原页：</b> <a class="btn" href="F3_Science_WS_Chapter8_Radioactivity_Trilingual_Answers.html" target="_blank">打开原题 + 原答案</a><p>本页专门逐题解释。答案依据上传的答案纸，不自行更换答案。</p></div><div id="app"></div></main><script>const D={"8.1":[["Objective Q1","A","The half-life is 6 days. Going 6 days earlier means the mass doubles: 10 g × 2 = 20 g.","半衰期6天。往前6天，质量要乘2：10 g × 2 = 20 g，所以A。","Separuh hayat 6 hari. Enam hari sebelum itu, jisim berganda: 10 g × 2 = 20 g, jadi A.","half-life,6 days,double"],["Objective Q2","D","Henri Becquerel is the scientist stated in the uploaded answer as the first person to discover radioactivity.","上传答案指出 Henri Becquerel 是最先发现放射性的科学家，所以D。","Menurut skema, Henri Becquerel ialah saintis pertama yang menemui keradioaktifan, jadi D.","Henri Becquerel,discovery"],["Objective Q3","A","Radioactive radiation is classified into alpha, beta and gamma radiation. Therefore A.","放射性辐射分为 α、β、γ 三种，所以A。","Sinaran radioaktif dibahagi kepada alfa, beta dan gama, jadi A.","alpha,beta,gamma"],["Objective Q4","D","The S.I. unit of radioactivity/activity is becquerel, Bq.","放射性活度的SI单位是 becquerel（Bq），所以D。","Unit S.I. aktiviti radioaktif ialah becquerel (Bq), jadi D.","becquerel,Bq,SI unit"],["Structured Q1","(a) Henri Becquerel\n(b) Wilhelm Roentgen\n(c) Marie and Pierre Curie","Match each discovery clue: Becquerel—radioactivity; Roentgen—X-rays; Marie and Pierre Curie—radioactive elements such as radium and polonium.","科学史配对：Becquerel—放射性；Roentgen—X射线；Marie和Pierre Curie—镭、钋等放射性元素。","Padanan sejarah: Becquerel—keradioaktifan; Roentgen—sinar-X; Marie dan Pierre Curie—unsur radioaktif seperti radium dan polonium.","Becquerel,Roentgen,Curie"],["Structured Q2","Radioactivity is the spontaneous decay process of an unstable nucleus by emitting radioactive radiation.","Three marking keywords are needed: unstable nucleus, spontaneous decay, emission of radioactive radiation.","定义必须有三个评分关键词：不稳定原子核、自发衰变、放出放射性辐射。","Tiga kata kunci: nukleus tidak stabil, pereputan spontan, pemancaran sinaran radioaktif.","unstable nucleus,spontaneous decay,emission"],["Structured Q3","α: 2 protons + 2 neutrons, positive\nβ: negative\nγ: neutral","Alpha is a helium nucleus; beta is a high-speed electron; gamma is an electromagnetic wave.","α是氦原子核，所以有2质子+2中子并带正电；β是高速电子带负电；γ是电磁波不带电。","Alfa ialah nukleus helium; beta ialah elektron berkelajuan tinggi; gama ialah gelombang elektromagnet.","alpha positive,beta negative,gamma neutral"],["Structured Q4","600 → 300; half-life = 2 hours; Carbon-14 and radon-222","Step 1 take original activity 600. Step 2 half is 300. Step 3 read the graph at 300: 2 hours. Half-life means the undecayed amount falls to half the original.","步骤：原值600 → 一半300 → 图中找300对应时间=2小时。半衰期就是未衰变量降到原值一半所需时间。","Langkah: 600 → separuh 300 → baca graf pada 300 = 2 jam. Separuh hayat ialah masa untuk baki tidak mereput menjadi separuh nilai asal.","600→300,2 hours,half-life"]],"8.2":[["Objective Q1","B","An ion has unequal numbers of protons and electrons. B has 9 protons and 10 electrons, so it is negatively charged.","离子的质子数和电子数不相等。B有9质子、10电子，所以带负电。","Ion mempunyai bilangan proton dan elektron yang tidak sama. B ada 9 proton dan 10 elektron, jadi bercas negatif.","proton,electron,ion"],["Objective Q2","C","Electron is negative, proton positive, neutron neutral. Only C is fully correct.","电子负、质子正、中子中性，只有C全部正确。","Elektron negatif, proton positif, neutron neutral. Hanya C betul sepenuhnya.","electron−,proton+,neutron0"],["Objective Q3","A","A calcium atom and calcium ion are still calcium, so their proton number is the same. Ion formation changes electrons, not protons.","钙原子和钙离子仍是钙，所以质子数相同。形成离子改变电子，不改变质子。","Atom dan ion kalsium masih unsur kalsium, jadi bilangan proton sama. Pembentukan ion mengubah elektron, bukan proton.","same protons,ion formation"],["Objective Q4","A","An atom that gains or loses electrons becomes charged; a charged atom is an ion.","原子得到或失去电子后带电，带电原子叫离子，所以A。","Atom yang menerima atau kehilangan elektron menjadi bercas; atom bercas ialah ion, jadi A.","gain/lose electron,ion"],["Structured Q1","J Electron; K Neutron; L Proton; total charge = 0","Electrons are outside the nucleus; protons and neutrons are in the nucleus. Equal positive and negative charges give total charge zero.","电子在核外；质子和中子在核内。正负电荷相等会互相抵消，总电荷=0。","Elektron di luar nukleus; proton dan neutron di dalam nukleus. Cas positif dan negatif sama lalu jumlah cas sifar.","electron outside,nucleus,neutral"],["Structured Q2","Loses electrons → positive ion; gains electrons → negative ion","Losing negative electrons leaves a net positive charge. Gaining electrons adds negative charge.","失去负电子后整体变正；得到电子后负电增加。口诀：失电子正，得电子负。","Kehilangan elektron negatif menghasilkan cas positif; menerima elektron menambah cas negatif.","lose e− positive,gain e− negative"],["Structured Q3","Na atom: 12n,11p,11e,total 0; Na ion: 12n,11p,10e,total +1","Sodium loses one electron. Protons stay 11, electrons become 10. Net charge = +11 − 10 = +1.","钠失去1个电子：质子仍11，电子从11变10，总电荷=+11−10=+1。","Natrium kehilangan satu elektron. Proton kekal 11, elektron menjadi 10. Cas bersih = +11 − 10 = +1.","Na loses 1e−,+1"],["Structured Q4","X: positive ion; Y: negative ion; X charge +2","X loses two electrons, therefore X is +2. Y receives electrons, therefore Y becomes negative.","X失去2电子，所以X形成+2正离子；Y得到电子，所以Y形成负离子。","X kehilangan dua elektron, jadi X bercas +2. Y menerima elektron, jadi Y menjadi ion negatif.","lose 2e−,+2"]],"8.3":[["Objective Q1","D","X is not deflected in the magnetic field, so X is gamma radiation. Gamma has strong penetrating power.","X在磁场中不偏转，所以X是γ射线；γ穿透力强，因此D。","X tidak terpesong dalam medan magnet, jadi X ialah sinar gama. Gama mempunyai kuasa penembusan tinggi, jadi D.","gamma,no deflection,penetration"],["Objective Q2","C","Cosmic rays come from outer space beyond the Solar System.","宇宙射线来自太阳系以外的外太空，所以C。","Sinar kosmik berasal dari angkasa lepas di luar Sistem Suria, jadi C.","cosmic ray"],["Objective Q3","B","Background radiation dose rate is expressed in microSievert per hour, μSv/h.","背景辐射剂量率用每小时微希沃特 μSv/h 表示，所以B。","Kadar dos sinaran latar belakang dinyatakan dalam μSv/h, jadi B.","background radiation,μSv/h"],["Objective Q4","B","Ionising power: alpha > beta > gamma. Therefore beta is lower than alpha but higher than gamma.","电离能力顺序 α>β>γ，所以β比α低、比γ高，答案B。","Kuasa pengionan α>β>γ. Beta lebih rendah daripada alfa tetapi lebih tinggi daripada gama, jadi B.","α>β>γ ionising"],["Structured Q1","Ionising vs non-ionising radiation","Ionising radiation can remove electrons from atoms and form ions. Non-ionising radiation does not normally form ions. Use this definition to classify examples.","电离辐射能把电子从原子移走形成离子；非电离辐射通常不能。先记定义，再分类例子。","Sinaran mengion boleh menyingkir elektron daripada atom dan membentuk ion; sinaran tidak mengion biasanya tidak membentuk ion.","ion formation,high energy"],["Structured Q2","Alpha: +, high ionising, low penetration; Beta: −, moderate; Gamma: neutral, low ionising, high penetration","Two opposite orders: ionising α>β>γ; penetration γ>β>α. Charge controls deflection.","两个相反顺序：电离 α>β>γ；穿透 γ>β>α。电荷决定偏转：α正、β负、γ中性。","Dua susunan bertentangan: pengionan α>β>γ; penembusan γ>β>α. Cas menentukan pemesongan.","α>β>γ,γ>β>α,charge"],["Structured Q3","M Alpha; N Gamma; O Beta","Gamma goes straight because it is neutral. Heavy positive alpha deflects less; light negative beta deflects more in the opposite direction.","γ中性所以直线；α较重、带正电，偏转较小；β较轻、带负电，向相反方向偏转较大。","Gama neutral lalu bergerak lurus. Alfa positif dan berat terpesong sedikit; beta negatif dan ringan terpesong lebih besar ke arah bertentangan.","gamma straight,alpha small,beta large"],["Structured Q4","Background radiation; cosmic ray; 1 Sv=1 J/kg; μSv/h; Geiger counter; nuclear accident/test/radioisotopes","This question links definition, source, unit and detector. Background radiation is environmental ionising radiation; dose is in Sv; dose rate in μSv/h; Geiger counter detects radiation.","这题把定义、来源、单位、仪器连起来：背景辐射是环境电离辐射；剂量Sv；剂量率μSv/h；Geiger counter检测辐射。","Soalan ini menghubungkan definisi, sumber, unit dan alat: dos dalam Sv, kadar dos μSv/h, pembilang Geiger mengesan sinaran.","Sv,μSv/h,Geiger counter"],["Structured Q5","High altitude → stronger cosmic radiation; reduce exposure time; safe dose <0.2 μSv/h","At high altitude there is less atmospheric shielding, so cosmic-ray exposure is higher. Reduce time on long/high-altitude flights.","高空大气屏蔽较少，所以宇宙射线暴露更高；安全方法是减少长途/高空飞行暴露时间。","Di altitud tinggi perlindungan atmosfera berkurang, jadi sinar kosmik lebih kuat. Kurangkan masa pendedahan pada penerbangan panjang/tinggi.","high altitude,cosmic,reduce time"]],"8.4":[["Objective Q1","A","Lead is dense and effective for radiation shielding.","铅密度高，能有效屏蔽辐射，所以A。","Plumbum tumpat dan berkesan sebagai perisai sinaran, jadi A.","lead,shielding"],["Objective Q2","C","Radiotherapy uses gamma rays because they penetrate tissue and damage cancer-cell DNA.","放射治疗用γ射线，因为它能穿透组织并破坏癌细胞DNA，所以C。","Radioterapi menggunakan sinar gama kerana boleh menembusi tisu dan merosakkan DNA sel kanser, jadi C.","gamma,radiotherapy,DNA"],["Objective Q3","B","Carbon-14 is used to estimate the age of once-living remains such as bones.","Carbon-14用于估算曾有生命的遗骸如骨骼的年龄，所以B。","Karbon-14 digunakan untuk menganggarkan usia tinggalan organisma seperti tulang, jadi B.","Carbon-14,dating"],["Objective Q4","A","Gamma irradiation preserves food by killing bacteria/microorganisms.","γ辐照通过杀死细菌和微生物来保存食物，所以A。","Penyinaran gama mengawet makanan dengan membunuh bakteria/mikroorganisma, jadi A.","gamma,food preservation"],["Structured Q1","Match radioisotopes with uses","Different radioisotopes are chosen for different applications according to radiation type and half-life. Match the worksheet examples exactly to the uploaded answer.","不同放射性同位素按辐射类型和半衰期用于不同用途。配对时严格跟上传答案。","Radioisotop berbeza digunakan mengikut jenis sinaran dan separuh hayat. Padankan tepat mengikut skema.","radioisotope,application,half-life"],["Structured Q2","Gamma ray; kills cancer cells by damaging DNA","Gamma penetrates tissue and reaches cancer cells. Damage to DNA prevents normal cell division.","γ能穿透组织到达癌细胞；破坏DNA后，癌细胞无法正常继续分裂。","Gama menembusi tisu dan sampai ke sel kanser. Kerosakan DNA menghalang pembahagian sel normal.","gamma,DNA,cancer"],["Structured Q3","Lead; protective clothes; robotic hands; excessive radiation can cause mutation/cancer","Lead provides shielding; protective clothing reduces exposure; robotic hands increase distance. Excess radiation can damage cells and cause mutation or cancer.","铅用于屏蔽；防护衣减少暴露；机械手增加距离。过量辐射会损伤细胞，导致突变或癌症。","Plumbum sebagai perisai; pakaian perlindungan mengurangkan pendedahan; tangan robot menambah jarak. Sinaran berlebihan boleh menyebabkan mutasi atau kanser.","lead,protection,distance,mutation"]]};function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}let o='';for(const sec of Object.keys(D)){o+=`<section id="s${sec.replace('.','')}"><div class="sec"><h2>${sec}</h2></div>`;for(const q of D[sec]){const kws=q[5].split(',').map(x=>`<span class="kw">${esc(x)}</span>`).join('');o+=`<div class="card"><h3>${sec} ${esc(q[0])}</h3><div class="answer">Answer / 答案 / Jawapan: ${esc(q[1])}</div><div class="tri"><div class="lang"><b>English explanation</b>${esc(q[2])}</div><div class="lang"><b>华语解释</b>${esc(q[3])}</div><div class="lang"><b>Penerangan BM</b>${esc(q[4])}</div></div><div>${kws}</div><div class="steps"><b>口诀 / Steps / Petua:</b> 找题目关键词 → 对规则 → 写上传答案 → 解释题写 cause → effect；计算题写 formula → substitute → unit.</div></div>`}o+='</section>'}document.getElementById('app').innerHTML=o;</script></body></html>
